name: MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oylatap
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: oylatap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oylatap -d oylatap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oylatap:ci_only_password@127.0.0.1:5432/oylatap
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # Use the same H.264-capable browser as the product's MP4 playback checks.
      - run: npx playwright install --with-deps chrome
      - run: npm run db:migrate && npm run db:seed
      - run: npm run format:check && npm run build && npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
